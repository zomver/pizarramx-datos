name: Actualizar partidos y posiciones — Europa

# Premier League, LaLiga, Serie A y Bundesliga. Separado del de América
# desde 2026-08-26 (ver partidos_america.yml para el motivo completo).
# Sin Leagues Cup ni videos/detalles_manuales — esas dos cosas son todas
# de Liga MX, las sigue manejando el cron de América.

# El horario real lo maneja cron-job.org desde el 2026-09-15: cada 10
# minutos, en los minutos :05, :15, :25... — desfasado 5 min del de
# América para no pegarle a la misma llave gratuita de TheSportsDB al
# mismo tiempo. La explicación completa de por qué ya no lo maneja el
# "schedule" de GitHub está en partidos_america.yml.
#
# Lo de aquí abajo es solo la RED DE SEGURIDAD cada 6 horas, por si
# cron-job.org se cae o el token expira.
on:
  schedule:
    - cron: '22 */6 * * *'
  workflow_dispatch:

concurrency:
  group: actualizar-datos-europa
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: pip install -r datos/requirements.txt

      - name: Generar datos de Europa (posiciones, partidos, datos.js)
        run: python datos/generar_europa.py

      - name: Subir datos/salida a Hostinger por FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./datos/salida/
          server-dir: ./datos/salida/
          timeout: 60000

      - name: Guardar caché de jornadas terminadas en el repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add datos/salida/cache_rondas_europa.json
          git diff --cached --quiet || git commit -m "Actualizar caché de jornadas (Europa)"
          # mismo fix que partidos_america.yml: reintenta el pull+push si
          # el de América (u otra corrida disparada a mano) empujó a
          # "main" justo entre nuestro pull y nuestro push (push
          # rechazado por non-fast-forward) — antes tumbaba el paso
          # entero sin reintentar, aunque generar/FTP ya hubieran salido
          # bien arriba.
          for intento in 1 2 3 4 5; do
            git pull --rebase origin main
            if git push; then
              exit 0
            fi
            echo "push rechazado (intento $intento/5), reintentando..."
            sleep $((RANDOM % 10 + 5))
          done
          echo "no se pudo subir el caché tras 5 intentos — no afecta el sitio (ya se subió por FTP arriba), solo se repiten algunas llamadas a la API la próxima corrida"
