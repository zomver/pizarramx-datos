name: Actualizar partidos y posiciones — América

# Liga BBVA MX, Argentina, Brasil y Leagues Cup. Separado del de Europa
# desde 2026-08-26: con las 7 ligas juntas en un solo cron cada corrida
# tardaba ~6 min y solo iba a seguir creciendo. Cada continente ahora
# escribe sus propios archivos (posiciones_america.json,
# partidos_america.json, cache_rondas_america.json) para que uno nunca
# le pise al otro el archivo — ver sincronizar_otro_continente() en
# generar_datos.py para cómo se vuelven a juntar en un solo datos.js.

# QUIÉN DISPARA ESTE WORKFLOW (cambió el 2026-09-15)
#
# El horario real lo maneja cron-job.org, que llama a la API de
# workflow_dispatch de GitHub cada 10 minutos (minutos :00, :10, :20...).
#
# Por qué ya no lo maneja el "schedule" de aquí abajo: GitHub documenta
# que los workflows programados corren "en base al mejor esfuerzo", y en
# repos públicos del plan gratuito con crons frecuentes eso significa que
# descarta la enorme mayoría. Medido sobre el historial real de este mismo
# repo: este workflow, programado cada 10 min (144 corridas al día),
# disparaba unas 6 veces al día, con huecos de hasta 5 horas. El de
# transmisiones (*/5, 288 al día) también ~6. En cambio estadisticas.yml,
# programado 1 vez al día, disparó 12 de 12 días — llegando tarde, pero
# nunca lo descartó. O sea: GitHub castiga la frecuencia, no la
# programación en sí.
#
# El "schedule" se deja, pero espaciado a cada 6 horas, como RED DE
# SEGURIDAD: si cron-job.org se cae, o el token de GitHub expira, o
# alguien borra el cronjob por error, el sitio sigue actualizándose 4
# veces al día en vez de quedarse congelado para siempre. A esa
# frecuencia GitHub sí lo respeta (ver el dato de estadisticas.yml
# arriba). El minuto :07 es distinto al de Europa (:22) y transmisiones
# (:37) para que los tres respaldos no caigan juntos sobre la misma
# llave gratuita de TheSportsDB.
on:
  schedule:
    - cron: '7 */6 * * *'
  workflow_dispatch:

concurrency:
  group: actualizar-datos-america
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: pip install -r datos/requirements.txt

      - name: Generar datos de América (posiciones, partidos, videos, datos.js)
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python datos/generar_america.py

      - name: Subir datos/salida a Hostinger por FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./datos/salida/
          server-dir: ./datos/salida/
          timeout: 60000

      - name: Guardar caché de jornadas terminadas en el repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add datos/salida/cache_rondas_america.json datos/salida/cache_videos.json
          git diff --cached --quiet || git commit -m "Actualizar caché de jornadas y videos (América)"
          # reintenta el pull+push varias veces: si el workflow de Europa
          # (u otra corrida disparada a mano) empuja a "main" justo entre
          # nuestro pull y nuestro push, el push se rechaza (non-fast-
          # forward) — antes eso tumbaba el paso entero sin reintentar.
          # Detectado el 2026-08-31: dos corridas seguidas fallaron aquí
          # mismo mientras generar/FTP sí habían salido bien (el sitio
          # nunca se vio afectado, solo se perdía el caché de esa corrida).
          for intento in 1 2 3 4 5; do
            git pull --rebase origin main
            if git push; then
              exit 0
            fi
            echo "push rechazado (intento $intento/5), reintentando..."
            sleep $((RANDOM % 10 + 5))
          done
          echo "no se pudo subir el caché tras 5 intentos — no afecta el sitio (ya se subió por FTP arriba), solo se repiten algunas llamadas a la API la próxima corrida"
