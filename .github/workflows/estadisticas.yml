name: Actualizar estadísticas de liga (goleadores, asistencias, tarjetas)

# Aparte de partidos_america.yml/partidos_europa.yml (que corre cada 10 min) a propósito: estos datos
# no cambian en vivo y pedirlos requiere una llamada a lookuptimeline.php
# POR PARTIDO — no cabe en el presupuesto de una corrida cada 10 minutos.
# Una vez al día alcanza de sobra.
on:
  schedule:
    # 09:17 UTC — lejos de las corridas de partidos_america.yml/partidos_europa.yml (minutos "raros",
    # mismo criterio que ahí: evitar el tope de cada hora) y a una hora en
    # la que ya casi no hay partidos en vivo de ninguna de las 3 ligas.
    - cron: '17 9 * * *'
  workflow_dispatch:

concurrency:
  group: actualizar-estadisticas
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: pip install -r datos/requirements.txt

      - name: Generar estadisticas.json
        run: python datos/estadisticas_liga.py

      # OJO: a propósito este workflow NO sube nada por FTP. Si
      # regenerara y subiera datos.js aquí, lo haría a partir de un
      # checkout limpio que no tiene posiciones.json/partidos.json (esos
      # nunca se commitean al repo, solo viajan por FTP) y pisaría el
      # datos.js real de Hostinger con uno sin partidos/tabla. En vez de
      # eso, se commitea estadisticas.json al repo (igual que
      # cache_rondas.json) y la siguiente corrida normal de partidos_america.yml/partidos_europa.yml
      # (máximo 10 min después) lo recoge sola al generar su propio
      # datos.js completo.
      - name: Guardar estadísticas y caché en el repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add datos/salida/estadisticas.json datos/salida/cache_estadisticas.json
          git diff --cached --quiet || git commit -m "Actualizar estadísticas de liga"
          git pull --rebase origin main
          git push
